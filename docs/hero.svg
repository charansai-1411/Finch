<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0d1428"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFCE86"/>
      <stop offset="1" stop-color="#E8871F"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a5cff"/>
      <stop offset="1" stop-color="#46b4ff"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#05070f" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1200" height="620" rx="22" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="619" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="1080" cy="70" r="240" fill="#9a5cff" opacity="0.06"/>
  <circle cx="240" cy="560" r="220" fill="#FFBA60" opacity="0.05"/>

  <!-- ============ header ============ -->
  <g transform="translate(44,30)">
    <path d="M2,22 C10,19 17,12 21,3 C22,10 21,16 16,20 C23,17 29,12 32,5 C31,17 23,25 12,25 C7,25 4,24 2,22 Z" fill="url(#gold)"/>
  </g>
  <text x="86" y="56" font-size="26" font-weight="800" fill="#f5f6fa">Finch</text>

  <g>
    <rect x="150" y="40" width="266" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="283" y="60" font-size="12.5" font-weight="700" fill="#c7cbe0" text-anchor="middle">WeMakeDevs × AWS · First Commit</text>
  </g>
  <g>
    <rect x="902" y="40" width="254" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="922" cy="55" r="4" fill="#34c77b"/>
    <text x="1035" y="60" font-size="12.5" font-weight="600" fill="#c7cbe0" text-anchor="middle">Serverless on AWS · scales to zero</text>
  </g>

  <line x1="44" y1="90" x2="1156" y2="90" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- ============ left: headline + pitch + query pills ============ -->
  <text x="44" y="162" font-size="48" font-weight="800" fill="#f5f6fa">One line in.</text>
  <text x="44" y="218" font-size="48" font-weight="800" fill="#f5f6fa">A <tspan fill="url(#gold)">salesperson</tspan> out.</text>

  <g font-size="15" fill="#9aa0b4">
    <text x="44" y="256">Building, testing, deploying and managing AI agents is hard —</text>
    <text x="44" y="279">so most stores ship none. Finch does it for you: turn on a</text>
    <text x="44" y="302">ready-made agent or build your own, then paste one line.</text>
  </g>

  <text x="44" y="346" font-size="11" font-weight="700" letter-spacing="0.8" fill="#6f758c">UNDERSTANDS WHAT SHOPPERS ACTUALLY ASK</text>

  <!-- query pills -->
  <g>
    <g transform="translate(44,360)">
      <rect width="252" height="34" rx="11" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="22" cy="17" r="5.5" fill="none" stroke="#FFBA60" stroke-width="1.6"/>
      <line x1="26" y1="21" x2="30" y2="25" stroke="#FFBA60" stroke-width="1.6" stroke-linecap="round"/>
      <text x="44" y="22" font-size="14" fill="#d7dae6">something warm for winter</text>
    </g>
    <g transform="translate(44,402)">
      <rect width="178" height="34" rx="11" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="22" cy="17" r="5.5" fill="none" stroke="#FFBA60" stroke-width="1.6"/>
      <line x1="26" y1="21" x2="30" y2="25" stroke="#FFBA60" stroke-width="1.6" stroke-linecap="round"/>
      <text x="44" y="22" font-size="14" fill="#d7dae6">a gift under $50</text>
    </g>
    <g transform="translate(44,444)">
      <rect width="204" height="34" rx="11" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="22" cy="17" r="5.5" fill="none" stroke="#FFBA60" stroke-width="1.6"/>
      <line x1="26" y1="21" x2="30" y2="25" stroke="#FFBA60" stroke-width="1.6" stroke-linecap="round"/>
      <text x="44" y="22" font-size="14" fill="#d7dae6">shoes for wide feet</text>
    </g>
  </g>

  <!-- ============ right: the live AI-search mockup ============ -->
  <!-- search bar with neon glow -->
  <rect x="650" y="132" width="490" height="52" rx="26" fill="#FFBA60" opacity="0.45" filter="url(#glow)"/>
  <rect x="658" y="136" width="474" height="44" rx="22" fill="#0f1424" stroke="#FFBA60" stroke-width="1.5"/>
  <circle cx="686" cy="156" r="6" fill="none" stroke="#9aa0b4" stroke-width="1.6"/>
  <line x1="690.5" y1="160.5" x2="695" y2="165" stroke="#9aa0b4" stroke-width="1.6" stroke-linecap="round"/>
  <text x="708" y="163" font-size="14" fill="#c9cee0">something warm and cozy for winter</text>
  <g>
    <rect x="1072" y="147" width="46" height="22" rx="11" fill="url(#ai)"/>
    <path d="M1085,152 l1,3 l3,1 l-3,1 l-1,3 l-1,-3 l-3,-1 l3,-1 z" fill="#fff"/>
    <text x="1101" y="162.5" font-size="10.5" font-weight="800" fill="#fff">AI</text>
  </g>

  <!-- results dropdown -->
  <rect x="664" y="196" width="462" height="216" rx="14" fill="#ffffff" filter="url(#cardShadow)"/>
  <rect x="664.5" y="196.5" width="461" height="215" rx="13.5" fill="none" stroke="#141420" stroke-opacity="0.06"/>

  <!-- head -->
  <path d="M688,208 l1.4,4 l4,1.4 l-4,1.4 l-1.4,4 l-1.4,-4 l-4,-1.4 l4,-1.4 z" fill="url(#gold)"/>
  <text x="702" y="218" font-size="12"><tspan font-weight="800" fill="#1c1813">Finch AI</tspan><tspan fill="#8a8578"> · something warm and cozy for winter</tspan></text>
  <line x1="680" y1="230" x2="1110" y2="230" stroke="#141420" stroke-opacity="0.06"/>

  <!-- conversational lead-in (the salesperson line) -->
  <path d="M688,244 l1.2,3.4 l3.4,1.2 l-3.4,1.2 l-1.2,3.4 l-1.2,-3.4 l-3.4,-1.2 l3.4,-1.2 z" fill="#E07C09"/>
  <text x="702" y="252" font-size="12.5" fill="#4a4636">Here are a couple of cozy picks perfect for winter:</text>

  <!-- product rows -->
  <g>
    <!-- Cable Crew -->
    <rect x="682" y="266" width="40" height="40" rx="8" fill="#efe7da"/>
    <path d="M690 296 q10 -18 22 0" fill="none" stroke="#c9a96a" stroke-width="3"/>
    <text x="734" y="284" font-size="13.5" font-weight="700" fill="#1c1813">Cable Crew</text>
    <text x="734" y="300" font-size="11.5" fill="#6b6457">Merino blend · Oat</text>
    <text x="1108" y="292" font-size="13" font-weight="800" fill="#1c1813" text-anchor="end">$142</text>

    <!-- Frost Hoodie -->
    <rect x="682" y="312" width="40" height="40" rx="8" fill="#e6eaf0"/>
    <path d="M692 342 q10 -16 20 0" fill="none" stroke="#9fb0c6" stroke-width="3"/>
    <text x="734" y="330" font-size="13.5" font-weight="700" fill="#1c1813">Frost Hoodie</text>
    <text x="734" y="346" font-size="11.5" fill="#6b6457">Heavyweight fleece · Grey</text>
    <text x="1108" y="338" font-size="13" font-weight="800" fill="#1c1813" text-anchor="end">$118</text>

    <!-- Boxy Tee -->
    <rect x="682" y="358" width="40" height="40" rx="8" fill="#f2f2f4"/>
    <rect x="694" y="368" width="16" height="20" rx="3" fill="#dcdce2"/>
    <text x="734" y="376" font-size="13.5" font-weight="700" fill="#1c1813">Boxy Tee</text>
    <text x="734" y="392" font-size="11.5" fill="#6b6457">Organic cotton · White</text>
    <text x="1108" y="384" font-size="13" font-weight="800" fill="#1c1813" text-anchor="end">$48</text>
  </g>

  <!-- ============ pipeline ============ -->
  <g>
    <!-- box 1 -->
    <rect x="44" y="498" width="261" height="64" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07"/>
    <rect x="44" y="498" width="4" height="64" rx="2" fill="#FFBA60"/>
    <text x="62" y="525" font-size="14" font-weight="700" fill="#eef0f6">Pick or build</text>
    <text x="62" y="545" font-size="11.5" fill="#9aa0b4">ready-made or no-code</text>
    <!-- box 2 -->
    <rect x="327" y="498" width="261" height="64" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07"/>
    <rect x="327" y="498" width="4" height="64" rx="2" fill="#9a5cff"/>
    <text x="345" y="525" font-size="14" font-weight="700" fill="#eef0f6">Connect data</text>
    <text x="345" y="545" font-size="11.5" fill="#9aa0b4">catalog · PDFs · docs</text>
    <!-- box 3 -->
    <rect x="610" y="498" width="261" height="64" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07"/>
    <rect x="610" y="498" width="4" height="64" rx="2" fill="#46b4ff"/>
    <text x="628" y="525" font-size="14" font-weight="700" fill="#eef0f6">Paste one line</text>
    <text x="628" y="545" font-size="11.5" fill="#9aa0b4">one &lt;script&gt; tag</text>
    <!-- box 4 -->
    <rect x="893" y="498" width="261" height="64" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07"/>
    <rect x="893" y="498" width="4" height="64" rx="2" fill="#34c77b"/>
    <text x="911" y="525" font-size="14" font-weight="700" fill="#eef0f6">Manage &amp; watch</text>
    <text x="911" y="545" font-size="11.5" fill="#9aa0b4">dashboard · no devs</text>

    <!-- arrows -->
    <g stroke="#5b6172" stroke-width="1.6" fill="#5b6172">
      <line x1="309" y1="530" x2="321" y2="530"/><path d="M321,527 l5,3 l-5,3 z"/>
      <line x1="592" y1="530" x2="604" y2="530"/><path d="M604,527 l5,3 l-5,3 z"/>
      <line x1="875" y1="530" x2="887" y2="530"/><path d="M887,527 l5,3 l-5,3 z"/>
    </g>
  </g>

  <!-- ============ stats ============ -->
  <g>
    <text x="44" y="598" font-size="25" font-weight="800" fill="#FFBA60">2</text>
    <text x="44" y="613" font-size="11.5" fill="#9aa0b4">prebuilt agents</text>

    <text x="327" y="598" font-size="25" font-weight="800" fill="#46b4ff">1 line</text>
    <text x="327" y="613" font-size="11.5" fill="#9aa0b4">to integrate</text>

    <text x="610" y="598" font-size="25" font-weight="800" fill="#34c77b">$0</text>
    <text x="610" y="613" font-size="11.5" fill="#9aa0b4">idle cost</text>

    <text x="893" y="598" font-size="25" font-weight="800" fill="#ff9a3d">Py 3.13</text>
    <text x="893" y="613" font-size="11.5" fill="#9aa0b4">on AWS Lambda</text>
  </g>
</svg>
