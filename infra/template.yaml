AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Finch — an AI salesperson for any store. Serverless backend:
  API Gateway (HTTP) + Lambda + DynamoDB + S3 + Bedrock. Scales to zero.

Parameters:
  WidgetCdn:
    Type: String
    Default: https://finch-widget-938358604976.s3.ap-south-1.amazonaws.com/v.js
    Description: Public URL where v.js is hosted (S3).
  SupportWidgetCdn:
    Type: String
    Default: https://finch-widget-938358604976.s3.ap-south-1.amazonaws.com/support.js
    Description: Public URL where the Support agent's support.js is hosted (S3).
  ChatModelId:
    Type: String
    Default: apac.amazon.nova-lite-v1:0
  EmbedModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
  GroqApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Groq API key (gsk_...). The agent turns on automatically once this is set.
  GroqModel:
    Type: String
    Default: llama-3.3-70b-versatile

Globals:
  Function:
    Runtime: python3.11
    Architectures: [x86_64]
    Timeout: 30
    MemorySize: 512
    CodeUri: ../backend/
    Environment:
      Variables:
        FINCH_BACKEND: "aws"
        FINCH_EMBED: "local"          # $0 hashed embedding — set to "bedrock" for real semantic search
        FINCH_AGENT: "on"             # active only when the provider has creds (see agent.ready())
        FINCH_AGENT_PROVIDER: "groq"  # groq | bedrock
        GROQ_API_KEY: !Ref GroqApiKey # empty until you deploy with --parameter-overrides GroqApiKey=...
        GROQ_MODEL: !Ref GroqModel
        TENANTS_TABLE: !Ref TenantsTable
        PRODUCTS_TABLE: !Ref ProductsTable
        CARTS_TABLE: !Ref CartsTable
        DOCS_TABLE: !Ref DocumentsTable
        CATALOG_BUCKET: !Ref CatalogBucket
        CHAT_MODEL_ID: !Ref ChatModelId
        EMBED_MODEL_ID: !Ref EmbedModelId
        WIDGET_CDN: !Ref WidgetCdn
        SUPPORT_WIDGET_CDN: !Ref SupportWidgetCdn

Resources:
  # ---------------- HTTP API ----------------
  FinchApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']            # embed key is publishable; tighten to domain_allowlist post-MVP
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [Content-Type]

  # ---------------- Lambdas ----------------
  IngestFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.handlers.ingest.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TenantsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ProductsTable }
        - S3CrudPolicy: { BucketName: !Ref CatalogBucket }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub arn:aws:bedrock:*::foundation-model/*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
      Events:
        Ingest:
          Type: HttpApi
          Properties:
            ApiId: !Ref FinchApi
            Path: /ingest
            Method: POST

  ChatFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.handlers.chat.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref TenantsTable }
        - DynamoDBReadPolicy: { TableName: !Ref ProductsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CartsTable }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub arn:aws:bedrock:*::foundation-model/*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
      Events:
        Chat:
          Type: HttpApi
          Properties:
            ApiId: !Ref FinchApi
            Path: /chat
            Method: POST

  SnippetFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.handlers.snippet.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref TenantsTable }
      Events:
        Snippet:
          Type: HttpApi
          Properties:
            ApiId: !Ref FinchApi
            Path: /snippet/{tenant_id}
            Method: GET

  CartGetFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.handlers.cart.get_handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref CartsTable }
      Events:
        CartGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref FinchApi
            Path: /cart/{session_id}
            Method: GET

  CartAddFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.handlers.cart.add_handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref TenantsTable }
        - DynamoDBReadPolicy: { TableName: !Ref ProductsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CartsTable }
      Events:
        CartAdd:
          Type: HttpApi
          Properties:
            ApiId: !Ref FinchApi
            Path: /cart/{session_id}/add
            Method: POST

  # ---------------- Support agent (doc-grounded Q&A) ----------------
  SupportIngestFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.handlers.support.ingest_handler
      Timeout: 60                              # doc parsing + embedding a batch of chunks
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TenantsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref DocumentsTable }
        - Statement:                           # only used when FINCH_EMBED=bedrock
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub arn:aws:bedrock:*::foundation-model/*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
      Events:
        SupportIngest:
          Type: HttpApi
          Properties:
            ApiId: !Ref FinchApi
            Path: /support/ingest
            Method: POST

  SupportChatFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.handlers.support.chat_handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref TenantsTable }
        - DynamoDBReadPolicy: { TableName: !Ref DocumentsTable }
        - Statement:                           # embeddings + the bedrock answer provider
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub arn:aws:bedrock:*::foundation-model/*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
      Events:
        SupportChat:
          Type: HttpApi
          Properties:
            ApiId: !Ref FinchApi
            Path: /support/chat
            Method: POST

  # ---------------- DynamoDB ----------------
  TenantsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST          # scales to zero
      AttributeDefinitions:
        - { AttributeName: tenant_id, AttributeType: S }
        - { AttributeName: embed_key, AttributeType: S }
      KeySchema:
        - { AttributeName: tenant_id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: embed_key-index         # resolve widget key -> tenant
          KeySchema:
            - { AttributeName: embed_key, KeyType: HASH }
          Projection: { ProjectionType: ALL }

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: tenant_id, AttributeType: S }
        - { AttributeName: product_id, AttributeType: S }
      KeySchema:
        - { AttributeName: tenant_id, KeyType: HASH }
        - { AttributeName: product_id, KeyType: RANGE }

  # Support-agent document chunks — one item per passage, embedding on the item
  # (same discovery-vs-truth pattern as ProductsTable). Queried by tenant_id.
  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: tenant_id, AttributeType: S }
        - { AttributeName: chunk_id, AttributeType: S }
      KeySchema:
        - { AttributeName: tenant_id, KeyType: HASH }
        - { AttributeName: chunk_id, KeyType: RANGE }

  CartsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: session_id, AttributeType: S }
      KeySchema:
        - { AttributeName: session_id, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ---------------- S3 (raw per-tenant catalog) ----------------
  CatalogBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  ApiUrl:
    Description: Base URL of the Finch API — set this as FINCH_ENDPOINT in the widget.
    Value: !Sub https://${FinchApi}.execute-api.${AWS::Region}.amazonaws.com
  CatalogBucketName:
    Value: !Ref CatalogBucket
